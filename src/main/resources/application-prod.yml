spring:
  datasource:
    url: jdbc:mysql://prod-db-server:3306/fitGearBack
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  jwt:
    secret: ${JWT_SECRET}
    accessTokenExpiration: 300000
    refreshTokenExpiration: 6048000
