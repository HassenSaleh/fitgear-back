spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/fitgearback
    username: postgres
    password: newpassword
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  jwt:
    secret: ${JWT_SECRET}
    accessTokenExpiration: 300000 # 5 minutes
    refreshTokenExpiration: 6048000 # ~70 days
chapa:
  secret-key: ${SECRET_KEY}
  public-key: ${PUBLIC_KEY}
  api-url: https://api.chapa.co/v1
