spring:
  application:
    name: fitgear-back
  profiles:
    active: dev  # Change to 'prod' when deploying

  jackson:
    default-property-inclusion: non_null

  main:
    allow-circular-references: true

  web:
    resources:
      static-locations:
        - file:uploads/

logging:
  level:
    com.ecommerce.fitgearback.filters: DEBUG
    io.jsonwebtoken: DEBUG
